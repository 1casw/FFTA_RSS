name: Générer et publier les flux RSS

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-publish:
    name: Générer les 2 RSS et publier
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Générer les compétitions à venir
        run: |
          python Generation-RSS-FFTA_Competitions_a_Venir.py

      - name: Vérifier le RSS des compétitions
        run: |
          test -f FFTA_Competitions_a_Venir.xml
          echo "✅ FFTA_Competitions_a_Venir.xml créé"

      - name: Générer les résultats
        run: |
          python Generation-RSS-FFTA_Resultats-Competitions.py

      - name: Vérifier le RSS des résultats
        run: |
          test -f FFTA_Resultats_Competitions.xml
          echo "✅ FFTA_Resultats_Competitions.xml créé"

      - name: Enregistrer les deux RSS dans Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add FFTA_Competitions_a_Venir.xml FFTA_Resultats_Competitions.xml

          if git diff --cached --quiet; then
            echo "Aucune modification des fichiers RSS."
          else
            git commit -m "Mise à jour des flux RSS"
            git push
          fi

      - name: Préparer les fichiers pour GitHub Pages
        run: |
          mkdir -p public

          cp FFTA_Competitions_a_Venir.xml public/
          cp FFTA_Resultats_Competitions.xml public/

          echo "Fichiers à publier :"
          ls -lh public

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Créer l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publier sur GitHub Pages
        uses: actions/deploy-pages@v4
